<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FAQ accordion (component) — TruTravels</title>
  <meta name="description" content="Collapsible FAQ list (native <details> — no JS)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:2.5rem 1.5rem 0;max-width:80rem;margin:0 auto;"><p style="color:#9ca3af;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.2em;font-size:0.72rem;margin:0;">FAQ accordion &mdash; demo</p></div>

  <!-- ===================================================================
       FAQ ACCORDION — native <details>/<summary>, no script needed. Add/remove .faq-item entries.
       Requires ../styles.css. -->
  <section style="padding:1.5rem 0 4rem;">
    <div class="container" style="max-width:48rem;"><div><span class="lbl">Duration</span><span class="val">14 Days</span></div>
          </div>
          <a href="#dates" class="btn btn--book btn--block">Check Dates &rarr;</a>
          <div class="pricing-card__trust pricing-card__trust--lg">
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Flexible payments</span>
          </div>
          <p class="pricing-card__plan">Pay a <strong>&pound;200 deposit</strong> and spread the rest interest-free.<br>Balance due 60 days before departure.</p>
          <div class="pricing-card__seals">
            <img src="assets/pay/atol-logo.png" alt="ATOL Protected" />
            <img class="abta" src="assets/pay/abta-logo.png" alt="ABTA — Travel With Confidence" />
          </div>
        </div>
        <div class="side-block">
          <p class="side-block__title">Map</p>
          <a class="map-thumb" href="#map-modal">
            <img src="https://cdn.trutravels.com/images/thailand-island-hopper-2023.png" alt="Thailand Island Hopper route map" />
            <span class="map-thumb__icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg></span></div>
  </section>

</body>
</html>
