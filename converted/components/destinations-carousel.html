<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Destinations carousel (component) — TruTravels</title>
  <meta name="description" content="Swipeable carousel of destination tiles (image + name + tagline)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:2.5rem 1.5rem 0;max-width:80rem;margin:0 auto;"><p style="color:#9ca3af;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.2em;font-size:0.72rem;margin:0;">Destinations carousel &mdash; demo</p></div>

  <!-- ===================================================================
       DESTINATIONS CAROUSEL — .rev-carousel of .country-tile items. Copy the carousel arrow + drag scripts (below).
       Requires ../styles.css. -->
  <section style="padding:1.5rem 0 4rem;">
        <section class="container dest-sec">
      <p class="dest-sec__eyebrow">Explore More</p>
      <h2 class="dest-sec__title">You Might Also Like</h2>
      <div class="rev-carousel dest-sec__carousel" data-arrows>
        <div class="carousel carousel--also">
          <a class="country-tile" href="#">
            <img class="country-tile__image" src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=800&q=80" alt="Indonesia" />
            <div class="country-tile__overlay"></div>
            <div class="country-tile__content">
              <h3 class="country-tile__name">Indonesia</h3>
              <p class="country-tile__tagline">Island of the Gods</p>
            </div>
          </a>
          <a class="country-tile" href="#">
            <img class="country-tile__image" src="https://images.unsplash.com/photo-1528127269322-539801943592?w=800&q=80" alt="Vietnam" />
            <div class="country-tile__overlay"></div>
            <div class="country-tile__content">
              <h3 class="country-tile__name">Vietnam</h3>
              <p class="country-tile__tagline">The Hidden Gem of Asia</p>
            </div>
          </a>
          <a class="country-tile" href="#">
            <img class="country-tile__image" src="https://images.unsplash.com/photo-1566296314736-6eaac1ca0cb9?w=800&q=80" alt="Sri Lanka" />
            <div class="country-tile__overlay"></div>
            <div class="country-tile__content">
              <h3 class="country-tile__name">Sri Lanka</h3>
              <p class="country-tile__tagline">The Teardrop of India</p>
            </div>
          </a>
          <a class="country-tile" href="#">
            <img class="country-tile__image" src="https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?w=800&q=80" alt="Philippines" />
            <div class="country-tile__overlay"></div>
            <div class="country-tile__content">
              <h3 class="country-tile__name">Philippines</h3>
              <p class="country-tile__tagline">7,000 Islands of Paradise</p>
            </div>
          </a>
          <a class="country-tile" href="#">
            <img class="country-tile__image" src="https://images.unsplash.com/photo-1504214208698-ea1916a2195a?w=800&q=80" alt="Cambodia" />
            <div class="country-tile__overlay"></div>
            <div class="country-tile__content">
              <h3 class="country-tile__name">Cambodia</h3>
              <p class="country-tile__tagline">Temples, History & Heart</p>
            </div>
          </a>
          <a class="country-tile" href="#">
            <img class="country-tile__image" src="https://images.unsplash.com/photo-1518638150340-f706e86654de?w=800&q=80" alt="Mexico" />
            <div class="country-tile__overlay"></div>
            <div class="country-tile__content">
              <h3 class="country-tile__name">Mexico</h3>
              <p class="country-tile__tagline">Colour, Culture & Chaos</p>
            </div>
          </a>
        </div>
        <button class="rev-arrow rev-arrow--prev" data-rev="prev" aria-label="Previous"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
        <button class="rev-arrow rev-arrow--next" data-rev="next" aria-label="Next"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </section>
<script>/* carousel nav arrows (reviews + you might like) */
  (function () {
    document.querySelectorAll('[data-arrows]').forEach(function (wrap) {
      var track = wrap.querySelector('.carousel, .side-stays, .vdiaries');
      var prev = wrap.querySelector('[data-rev="prev"]');
      var next = wrap.querySelector('[data-rev="next"]');
      if (!track || !prev || !next) return;
      function step() {
        var card = track.firstElementChild;
        var gap = parseFloat(getComputedStyle(track).columnGap) || 20;
        return card ? card.getBoundingClientRect().width + gap : track.clientWidth;
      }
      function sync() {
        var max = track.scrollWidth - track.clientWidth;
        prev.disabled = track.scrollLeft <= 1;
        next.disabled = track.scrollLeft >= max - 1;
      }
      prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
      next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
      track.addEventListener('scroll', sync, { passive: true });
      window.addEventListener('resize', sync);
      sync();
    });
  })();
  </script>
<script>/* experience-types disclosure — opening one card opens all (shared state, like the prototype) */
  (function () {
    var boxes = document.querySelectorAll('.tripcard__exp-cb');
    if (!boxes.length) return;
    boxes.forEach(function (cb) {
      cb.addEventListener('change', function () {
        boxes.forEach(function (other) {
          if (other !== cb) other.checked = cb.checked;
        });
      });
    });
  })();
  </script>
<script>/* drag-to-scroll with momentum — click/one-finger drag on every horizontal carousel (like Swiper) */
  (function () {
    document.querySelectorAll('.side-stays, .carousel, .vdiaries').forEach(function (track) {
      var down = false, startX = 0, startLeft = 0, moved = false, snap = '';
      var lastX = 0, lastT = 0, vx = 0, raf = null;
      track.style.cursor = 'grab';
      track.querySelectorAll('img').forEach(function (im) { im.setAttribute('draggable', 'false'); });
      track.addEventListener('dragstart', function (e) { e.preventDefault(); });
      function stopMomentum() { if (raf) { cancelAnimationFrame(raf); raf = null; } }
      track.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        stopMomentum();
        down = true; moved = false; startX = e.clientX; startLeft = track.scrollLeft;
        lastX = e.clientX; lastT = performance.now(); vx = 0;
        snap = track.style.scrollSnapType; track.style.scrollSnapType = 'none';
        track.style.cursor = 'grabbing';
        e.preventDefault();
      });
      document.addEventListener('mousemove', function (e) {
        if (!down) return;
        var dx = e.clientX - startX;
        if (Math.abs(dx) > 3) moved = true;
        track.scrollLeft = startLeft - dx;
        var now = performance.now(), dt = now - lastT;
        if (dt > 0) { vx = (e.clientX - lastX) / dt; lastX = e.clientX; lastT = now; }
      });
      document.addEventListener('mouseup', function () {
        if (!down) return; down = false; track.style.cursor = 'grab';
        if (moved) {
          var block = function (ev) { ev.preventDefault(); ev.stopPropagation(); };
          track.addEventListener('click', block, true);
          setTimeout(function () { track.removeEventListener('click', block, true); }, 0);
        }
        var v = -vx * 16;
        function step() {
          v *= 0.95;
          track.scrollLeft += v;
          if (Math.abs(v) > 0.4) { raf = requestAnimationFrame(step); }
          else { raf = null; track.style.scrollSnapType = snap; }
        }
        if (moved && Math.abs(v) > 1.5) { raf = requestAnimationFrame(step); }
        else { track.style.scrollSnapType = snap; }
      });
    });
  })();
  </script>
  </section>

</body>
</html>
