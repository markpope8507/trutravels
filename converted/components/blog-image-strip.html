<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Blog image strip (component) &mdash; TruTravels</title>
  <meta name="description" content="Multi-up image strip for article bodies — three landscape images at a time, arrows outside the track." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Note the ../ — this component lives in components/, styles.css is one level up -->
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:2.5rem 1.5rem 0;max-width:80rem;margin:0 auto;"><p style="color:#9ca3af;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.2em;font-size:0.72rem;margin:0;">Blog image strip component &mdash; demo (5 images, 3 visible)</p></div>

  <!-- ===================================================================
       BLOG IMAGE STRIP — the multi-up gallery from the live blog articles
       (trutravels.com/blog/10-day-peru-itinerary). Three 4:3 images at a
       time, scrolled by arrows that sit outside the track.

       Copy the whole <div class="rev-carousel img-strip" data-arrows> block
       into an article body. Requires styles.css (.img-strip*, .rev-arrow,
       .carousel) and the shared carousel-arrows script — already present on
       every built page, and included at the foot of this file so the demo
       works standalone.

       Add or remove <figure class="img-strip__item"> entries freely; the
       track scrolls and the arrows disable themselves at each end.

       Images are object-fit: cover, so any aspect ratio can go in and the
       4:3 frame is preserved. Add a <figcaption> to any figure if the
       article needs captions — it is hidden unless present.

       Distinct from blog-image-slider.html, which shows ONE image at a time
       inside a blog image box with a 1/N counter and dots. Use this one for a
       row of images, that one for a single framed image.
       =================================================================== -->
  <section style="padding:2rem 0 4rem;">
    <div class="container" style="max-width:66rem;">

      <div class="rev-carousel img-strip" data-arrows>
        <div class="carousel img-strip__track">
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-bike-ride3-3.jpg" alt="Mountain biking in the Sacred Valley" loading="lazy" />
          </figure>
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-llamas.jpg" alt="Llamas grazing above the Inca terraces" loading="lazy" />
          </figure>
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-rainbow4.jpg" alt="The group at Rainbow Mountain" loading="lazy" />
          </figure>
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-generic-3.jpg" alt="Exploring Peru" loading="lazy" />
          </figure>
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-incatrail2-day6.jpg" alt="Day six on the Inca Trail" loading="lazy" />
          </figure>
        </div>
        <button class="rev-arrow rev-arrow--prev" data-rev="prev" aria-label="Previous images"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
        <button class="rev-arrow rev-arrow--next" data-rev="next" aria-label="More images"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
      </div>

      <!-- With captions — same markup, figcaption added -->
      <p style="color:#6b7280;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.2em;font-size:0.68rem;margin:3rem 0 1rem;">With captions</p>
      <div class="rev-carousel img-strip" data-arrows>
        <div class="carousel img-strip__track">
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-rainbow4.jpg" alt="Rainbow Mountain" loading="lazy" />
            <figcaption>Rainbow Mountain, 5,200m &mdash; worth every step</figcaption>
          </figure>
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-llamas.jpg" alt="Llamas" loading="lazy" />
            <figcaption>The locals, unbothered</figcaption>
          </figure>
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-incatrail2-day6.jpg" alt="Inca Trail" loading="lazy" />
            <figcaption>Day six on the Inca Trail</figcaption>
          </figure>
          <figure class="img-strip__item">
            <img src="https://cdn.trutravels.com/images/peru-bike-ride3-3.jpg" alt="Sacred Valley" loading="lazy" />
            <figcaption>Downhill through the Sacred Valley</figcaption>
          </figure>
        </div>
        <button class="rev-arrow rev-arrow--prev" data-rev="prev" aria-label="Previous images"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
        <button class="rev-arrow rev-arrow--next" data-rev="next" aria-label="More images"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
      </div>

    </div>
  </section>

  <script>/* carousel nav arrows — the same script the built pages already carry.
     Included here only so this component demo works on its own. */
  (function () {
    document.querySelectorAll('[data-arrows]').forEach(function (wrap) {
      var track = wrap.querySelector('.carousel');
      var prev = wrap.querySelector('[data-rev="prev"]');
      var next = wrap.querySelector('[data-rev="next"]');
      if (!track || !prev || !next) return;
      function step() {
        var card = track.firstElementChild;
        var gap = parseFloat(getComputedStyle(track).columnGap) || 20;
        return card ? card.getBoundingClientRect().width + gap : track.clientWidth;
      }
      function sync() {
        var max = track.scrollWidth - track.clientWidth;
        prev.disabled = track.scrollLeft <= 1;
        next.disabled = track.scrollLeft >= max - 1;
      }
      prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
      next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
      track.addEventListener('scroll', sync, { passive: true });
      window.addEventListener('resize', sync);
      sync();
    });
  })();
  </script>
</body>
</html>
