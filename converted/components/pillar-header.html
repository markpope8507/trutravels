<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pillar header (component) — TruTravels</title>
  <meta name="description" content="Big pillar header: accent rule + eyebrow + title (last word accented) + description + line-art icon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:2.5rem 1.5rem 0;max-width:80rem;margin:0 auto;"><p style="color:#9ca3af;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.2em;font-size:0.72rem;margin:0;">Pillar header &mdash; demo</p></div>

  <!-- ===================================================================
       PILLAR HEADER — accent rule + eyebrow + title + description + big icon on the right (hidden on mobile).
       Requires ../styles.css. -->
  <section style="padding:1.5rem 0 4rem;">
    <section class="pillar" style="padding-top:1rem;">
      <div class="container pillar__inner">
        <div class="pillar__text">
          <div class="pillar__eyebrow-row"><span class="pillar__rule pillar__rule--pink"></span><p class="pillar__eyebrow pillar__eyebrow--pink">Read &middot; Long Form</p></div>
          <h2 class="pillar__title">Stories Worth <span class="tx-pink">Reading</span></h2>
          <p class="pillar__desc">Honest, in-depth pieces from the road. Travellers, guides, and our team &mdash; sharing the moments that stayed with them.</p>
        </div>
        <div class="pillar__icon tx-pink"><svg width="140" height="120" viewBox="0 0 140 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="70" y1="24" x2="70" y2="104"/><path d="M70 24 Q 50 18 18 24 L 18 100 Q 50 94 70 100 Z"/><path d="M70 24 Q 90 18 122 24 L 122 100 Q 90 94 70 100 Z"/><line x1="28" y1="40" x2="58" y2="38" opacity="0.6"/><line x1="28" y1="52" x2="58" y2="50" opacity="0.6"/><line x1="82" y1="38" x2="112" y2="40" opacity="0.6"/><line x1="82" y1="50" x2="112" y2="52" opacity="0.6"/><path d="M95 22 L95 56 L102 50 L109 56 L109 22" fill="currentColor" stroke="none" opacity="0.85"/></svg></div>
      </div>
    </section>
  </section>

</body>
</html>
