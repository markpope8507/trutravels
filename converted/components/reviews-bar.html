<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reviews bar (component) — TruTravels</title>
  <meta name="description" content="Flipping social-proof / protection strip for under the hero." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:2.5rem 1.5rem 1rem;max-width:80rem;margin:0 auto;"><p style="color:#9ca3af;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.2em;font-size:0.72rem;margin:0;">Reviews bar &mdash; demo (flips every 5s: reviews &harr; ABTA / ATOL)</p></div>

  <!-- ===================================================================
       REVIEWS BAR — copy this <section> under a hero (replaces the ticker).
       CSS-only flip between 22,000+ reviews and Fully Protected / ABTA+ATOL.
       Mobile: reviews row + (shield + Book with Confidence + logos).
       Desktop: full copy + platform names + Fully Protected title.
       Paths below use ../ because this demo lives in components/; drop the
       ../ when pasting into a page at the site root.
       Requires ../styles.css (.reviews-bar*). No script.
       =================================================================== -->
  <section class="reviews-bar" aria-label="Reviews and booking protection">
    <div class="reviews-bar__viewport">
      <div class="reviews-bar__slide reviews-bar__slide--a">
        <div class="reviews-bar__inner">
          <span class="reviews-bar__stat"><strong>22,000+</strong><span class="reviews-bar__stat-label">REVIEWS</span></span>
          <span class="reviews-bar__rule" aria-hidden="true"></span>
          <span class="reviews-bar__rating">
            <span class="reviews-bar__score">4.9</span>
            <span class="reviews-bar__stars" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="#FBBC05" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg viewBox="0 0 24 24"><path fill="#FBBC05" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg viewBox="0 0 24 24"><path fill="#FBBC05" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg viewBox="0 0 24 24"><path fill="#FBBC05" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg viewBox="0 0 24 24">
                <defs>
                  <linearGradient id="reviews-bar-star-4-9" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="70%" stop-color="#FBBC05"/>
                    <stop offset="70%" stop-color="rgba(255,255,255,0.28)"/>
                  </linearGradient>
                </defs>
                <path fill="url(#reviews-bar-star-4-9)" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
            </span>
          </span>
          <span class="reviews-bar__rule reviews-bar__rule--always" aria-hidden="true"></span>
          <span class="reviews-bar__platforms">
            <span class="reviews-bar__plat">
              <svg viewBox="0 0 48 48" aria-label="Google" role="img"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
              <span>Google</span>
            </span>
            <span class="reviews-bar__plat">
              <svg viewBox="0 0 24 24" fill="#00B67A" aria-label="Trustpilot" role="img"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <span>Trustpilot</span>
            </span>
            <span class="reviews-bar__plat">
              <img src="../assets/platform-logos/tourradar-favicon.png" alt="TourRadar" />
              <span>TourRadar</span>
            </span>
          </span>
        </div>
      </div>
      <div class="reviews-bar__slide reviews-bar__slide--b">
        <div class="reviews-bar__inner">
          <span class="reviews-bar__protect-title">
            <svg class="reviews-bar__shield" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
            <span class="reviews-bar__protect-label">FULLY PROTECTED</span>
          </span>
          <span class="reviews-bar__protect-short">Book with Confidence</span>
          <span class="reviews-bar__protect-copy">ABTA &amp; ATOL protected - Book with Confidence</span>
          <span class="reviews-bar__rule reviews-bar__rule--desk" aria-hidden="true"></span>
          <span class="reviews-bar__protect-logos">
            <img src="../assets/pay/atol-logo.png" alt="ATOL Protected" />
            <img class="reviews-bar__abta" src="../assets/pay/abta-logo.png" alt="ABTA — Travel With Confidence" />
          </span>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
