<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Stay card (component) &mdash; TruTravels</title>
  <meta name="description" content="The Where You&rsquo;ll Stay card used on country and travel-style pages: 4:3 media, travel-style logo in the corner, title and caption." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Note the ../ — this component lives in components/, styles.css is one level up -->
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:2.5rem 1.5rem 0;max-width:80rem;margin:0 auto;"><p style="color:#9ca3af;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.2em;font-size:0.72rem;margin:0;">Stay card component &mdash; demo (Where You&rsquo;ll Stay row)</p></div>

  <!-- ===================================================================
       STAY CARD COMPONENT — copy an <article class="stay-card"> into a
       .carousel. Requires styles.css (.stay-card*, .carousel*, .rev-*).

       Structure:
         .stay-card
           a.stay-card__media        4:3 box; the <a> opens the :target modal
             img                     the photo
             span.stay-card__glow    pink corner wash, behind the logo
             img.stay-card__style    the travel-style logo, assets/<style>-logo.png
             span.stay-card__play    play affordance (video stays only)
           .stay-card__body          h3.stay-card__title + p.stay-card__text

       THE LOGO IS THE POINT. Without it the row is four 4:3 photos of resorts
       with nothing to tell them apart. Use the tour's own style —
       classic / backpacker / flashpacker / multi-country / limited-edition.

       SPECIFICITY. `.stay-card__media img` sets the photo to 100%/100%, and at
       (0,1,1) it beats a lone class — which is why the logo rule is written
       `.stay-card__media img.stay-card__style`. Don't shorten it.

       ROW WIDTH. `.carousel--3up` is the country-page row width (1.1 / 1.4 /
       2.1 / 3.2 cards per view), matching the prototype's Swiper. Drop it if
       the row wants a different count.
       =================================================================== -->
  <section class="container section">
    <p class="eyebrow eyebrow--pink">Where You&rsquo;ll Stay</p>
    <h2 class="section-heading">Sleep Somewhere <span class="tx-pink">Special</span></h2>
    <div class="rev-carousel" data-arrows>
      <div class="carousel carousel--trips carousel--3up">
<article class="stay-card">
          <a class="stay-card__media" href="#stayvid-tiki-beach" aria-label="Play video of Tiki Beach Resort, Koh Phangan"><img src="https://images.unsplash.com/photo-1455587734955-081b22074882?w=1200&q=80" alt="Tiki Beach Resort, Koh Phangan" /><span class="stay-card__play"><span class="stay-card__play-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></span><span class="stay-card__glow"></span><img class="stay-card__style" src="../assets/classic-logo.png" alt="Classic travel style" /></a>
          <div class="stay-card__body"><h3 class="stay-card__title">Tiki Beach Resort, Koh Phangan</h3><p class="stay-card__text">Beachfront bungalows and pools steps from the sand on Thailand&rsquo;s legendary party island.</p></div>
        </article>
        <button class="rev-arrow rev-arrow--prev" data-rev="prev" aria-label="Previous"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
        <button class="rev-arrow rev-arrow--next" data-rev="next" aria-label="Next"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>

<script>/* carousel nav arrows — the same block the pages carry */
  (function () {
    document.querySelectorAll('[data-arrows]').forEach(function (wrap) {
      var track = wrap.querySelector('.carousel');
      var prev = wrap.querySelector('[data-rev="prev"]');
      var next = wrap.querySelector('[data-rev="next"]');
      if (!track || !prev || !next) return;
      function step() {
        var card = track.firstElementChild;
        var gap = parseFloat(getComputedStyle(track).columnGap) || 20;
        return card ? card.getBoundingClientRect().width + gap : track.clientWidth;
      }
      function sync() {
        var max = track.scrollWidth - track.clientWidth;
        prev.disabled = track.scrollLeft <= 1;
        next.disabled = track.scrollLeft >= max - 1;
      }
      prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
      next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
      track.addEventListener('scroll', sync, { passive: true });
      window.addEventListener('resize', sync);
      sync();
    });
  })();
  </script>
</body>
</html>
